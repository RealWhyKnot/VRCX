name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Repo checks
    permissions:
      contents: read
    uses: RealWhyKnot/workflows/.github/workflows/repo-checks.yml@v1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Restore dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: CSS style rules
        run: npm run lint:css
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build html
        run: npm run prod

  lint:
    name: Lint
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Cache NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Build.props', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore VRCX.slnx -p:Platform=x64 --locked-mode
          if ($LASTEXITCODE -ne 0) { throw "restore failed ($LASTEXITCODE)" }
      - name: Check formatting
        shell: pwsh
        run: |
          dotnet format VRCX.slnx --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { throw "formatting drift ($LASTEXITCODE)" }
      - name: C# style rules
        shell: pwsh
        run: |
          dotnet run .github/lint/CSharpStyle.cs -- .
          if ($LASTEXITCODE -ne 0) { throw "C# style rules failed ($LASTEXITCODE)" }
      - name: Style check
        shell: pwsh
        run: |
          python -B .github/lint/style_check.py
          if ($LASTEXITCODE -ne 0) { throw "style check failed ($LASTEXITCODE)" }

  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build
        shell: pwsh
        run: |
          dotnet build VRCX.slnx -c Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }

  powershell:
    name: PowerShell
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PSScriptAnalyzer
        uses: RealWhyKnot/workflows/setup-pssa@v1
      - name: PowerShell style rules
        shell: pwsh
        run: |
          ./.github/lint/Invoke-PSLint.ps1
          if ($LASTEXITCODE -ne 0) { throw "PowerShell style rules failed ($LASTEXITCODE)" }

  shell:
    name: Shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shell tools
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          SHFMT_VERSION: "3.14.1"
          SHFMT_SHA256: "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf"
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          download_directory=$(mktemp -d)
          trap 'rm -rf "${download_directory}"' EXIT
          tool_directory="${RUNNER_TEMP}/shell-tools/bin"
          shellcheck_release_url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}"
          curl -fsSL --max-time 60 --retry 3 \
            "${shellcheck_release_url}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            -o "${download_directory}/shellcheck.tar.xz"
          shfmt_release_url="https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}"
          curl -fsSL --max-time 60 --retry 3 \
            "${shfmt_release_url}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
            -o "${download_directory}/shfmt"
          actionlint_release_url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL --max-time 60 --retry 3 \
            "${actionlint_release_url}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "${download_directory}/actionlint.tar.gz"
          printf '%s  %s\n' \
            "${SHELLCHECK_SHA256}" "${download_directory}/shellcheck.tar.xz" \
            "${SHFMT_SHA256}" "${download_directory}/shfmt" \
            "${ACTIONLINT_SHA256}" "${download_directory}/actionlint.tar.gz" | sha256sum -c
          mkdir -p "${tool_directory}"
          tar -xJf "${download_directory}/shellcheck.tar.xz" -C "${tool_directory}" \
            --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          mv "${download_directory}/shfmt" "${tool_directory}/shfmt"
          tar -xzf "${download_directory}/actionlint.tar.gz" -C "${tool_directory}" actionlint
          chmod 755 "${tool_directory}/shellcheck" "${tool_directory}/shfmt" "${tool_directory}/actionlint"
          printf '%s\n' "${tool_directory}" >> "${GITHUB_PATH}"
      - name: Shell style rules
        run: bash .githooks/check-shell
