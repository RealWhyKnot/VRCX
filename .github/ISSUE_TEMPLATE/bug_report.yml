name: Bug report
description: Something in VRCX is broken, shows the wrong data or crashes.
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: VRCX version
      description: The version in the release file name you installed, such as `2026.11.23.0`.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Error text or log
      description: Any error message or log lines around the problem. Remove names, IDs and anything else you don't want public.
      render: text
    validations:
      required: false
