[files]
extend-exclude = [
  "*.lock",
  "package-lock.json",
  "packages.lock.json",
  "pnpm-lock.yaml",
  "vendor/",
  "third_party/",
  "node_modules/",
  ".yarn/",
  "/Dotnet/Overlay/OpenVR/openvr_api.cs",
  "/Dotnet/libs/Blake2Sharp.dll",
  "/Dotnet/libs/librsync.net.dll",
  "/Dotnet/libs/openvr_api.dll",
  "/Installer/Plugins/x86-unicode/ApplicationID.dll",
  "/Installer/Plugins/x86-unicode/INetC.dll",
  "/Installer/Plugins/x86-unicode/ShellExecAsUser.dll",
  "/Installer/Plugins/x86-unicode/nsProcess.dll",
  "/src-electron/libs/linux/libopenvr_api.so",
  "/README/",
  "/src/shared/constants/remixIconTags.json",
  "/src/localization/cs.json",
  "/src/localization/es.json",
  "/src/localization/fr.json",
  "/src/localization/hu.json",
  "/src/localization/ja.json",
  "/src/localization/ko.json",
  "/src/localization/pl.json",
  "/src/localization/pt.json",
  "/src/localization/ru.json",
  "/src/localization/th.json",
  "/src/localization/vi.json",
  "/src/localization/zh-CN.json",
  "/src/localization/zh-TW.json",
]

[default]
extend-ignore-re = ["wrld_[0-9a-f-]{36}"]

[default.extend-identifiers]
StrCpy = "StrCpy"
loginParmas = "loginParmas"
CancelFriendRequst = "CancelFriendRequst"
tha = "tha"

[default.extend-words]
paeth = "paeth"
